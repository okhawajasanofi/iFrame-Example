<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rogue (sandboxed)</title>
<style>
  body { font: 14px system-ui, "Segoe UI", sans-serif; margin: 16px; color: #1b2430; background: #fff; }
  h1 { font-size: 18px; margin: 0 0 4px; } .sub { color: #5b6676; margin: 0 0 12px; }
  button { padding: 8px 16px; border-radius: 6px; border: 0; background: #b3261e; color: #fff; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 14px; width: 100%; max-width: 820px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid #dde3ec; vertical-align: top; }
  .pass { color: #1f7a3d; font-weight: 600; } .fail { color: #b3261e; font-weight: 700; }
</style>
</head>
<body>
<h1>Rogue (sandboxed)</h1>
<p class="sub">Hostile code running in a sandboxed iframe on another origin. "Pass" means the attack was stopped.</p>
<button id="run">Run attacks</button>
<table id="out" hidden><thead><tr><th>Attack</th><th>Result</th><th>Detail</th></tr></thead><tbody></tbody></table>
<script src="/sdk.js"></script>
<script>
var HOST = PlatformSDK.hostOrigin;

async function attacks(api) {
  var rows = [], probe = null;
  function add(name, pass, detail) { rows.push({ name: name, pass: pass, detail: detail }); }
  var me = await api.getSession();

  try { var t = window.parent.document.title; add('Read window.parent.document', false, 'READ title: ' + t); }
  catch (e) { add('Read window.parent.document', true, 'Blocked: ' + e.name); }

  try { var keys = Object.keys(localStorage); add('Read localStorage', keys.length === 0, keys.length ? 'found: ' + keys.join(',') : 'nothing found'); }
  catch (e) { add('Read localStorage', true, 'Blocked: ' + e.name); }

  add('Read document.cookie', document.cookie === '', document.cookie === '' ? 'nothing found' : 'found: ' + document.cookie);

  try { window.parent.localStorage.length; add('Read window.parent.localStorage', false, 'READ'); }
  catch (e) { add('Read window.parent.localStorage', true, 'Blocked: ' + e.name); }

  try {
    var r = await fetch(HOST + '/api/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ method: 'vehicles.list', params: {} }) });
    var j = await r.json();
    add('Call /api/rpc with no token', r.status === 401 && j.error && j.error.code === 'no_token', 'HTTP ' + r.status + ' ' + (j.error && j.error.code));
  } catch (e) { add('Call /api/rpc with no token', true, 'Blocked: ' + e.name); }

  try { await api.call('notes.add', { text: 'rogue' }); add('Call notes.add (outside its scope)', false, 'ALLOWED'); }
  catch (e) { add('Call notes.add (outside its scope)', e.code === 'scope_denied', 'Refused: ' + e.code); }

  try {
    var other = me.tenantId === 'globex' ? 'acme' : 'globex';
    var mine = await api.call('vehicles.list', {});
    var asked = await api.call('vehicles.list', { tenant: other });
    add('Ask for another tenant (tenant: "' + other + '")', JSON.stringify(mine) === JSON.stringify(asked), 'Field ignored: got own ' + me.tenant + ' data (' + asked.length + ' vehicles)');
  } catch (e) { add('Ask for another tenant', false, 'Error: ' + e.message); }

  // Forged messages that pretend to come from the host. Their origin is OUR origin and their source is OUR window, so the SDK ignores them.
  var pending = api.call('whoami', {});
  for (var i = 1; i <= 60; i++) window.postMessage({ type: 'rpc-result', id: i, result: { forged: true } }, '*');
  window.postMessage({ type: 'session', user: 'evil', tenant: 'evil' }, '*');
  var who = await pending, me2 = await api.getSession();
  add('Forged postMessage pretending to be the host', !who.forged && me2.user !== 'evil', 'Ignored (wrong origin and source)');

  // An RPC sent by a window that is not the child frame: a nested srcdoc iframe talks to the mainframe directly.
  window.__nestedReply = false;
  await new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.display = 'none';
    f.srcdoc = '<scr' + 'ipt>window.addEventListener("message",function(){parent.__nestedReply=true});' +
      'top.postMessage({type:"rpc",id:9001,method:"vehicles.list",params:{}},"*");</scr' + 'ipt>';
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); resolve(); }, 1200);
  });
  add('RPC from a window that is not the child frame', window.__nestedReply === false, window.__nestedReply ? 'The mainframe ANSWERED' : 'The mainframe ignored it (no reply)');

  // Not an attack: shows the standalone fallback (P8) can reach the sign-in endpoint from the child origin, with no credentials.
  try {
    var lr = await fetch(HOST + '/auth/login', { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: 'nobody@example.test', password: 'wrong' }) });
    var lj = await lr.json();
    probe = { pass: lr.status === 401 && lj.error.code === 'invalid_credentials', detail: 'Child origin reached POST /auth/login (CORS allowed it, no cookies sent): HTTP ' + lr.status + ' ' + lj.error.code };
  } catch (e) { probe = { pass: false, detail: 'Could not reach /auth/login: ' + e.message }; }
  return { rows: rows, probe: probe };
}

function show(rep) {
  var tb = document.querySelector('#out tbody'); tb.textContent = '';
  rep.rows.forEach(function (r) {
    var tr = document.createElement('tr'); tr.className = r.pass ? 'row-pass' : 'row-fail';
    [r.name, r.pass ? 'PASS (stopped)' : 'FAIL (not stopped)', r.detail].forEach(function (x, i) {
      var td = document.createElement('td'); td.textContent = x; if (i === 1) td.className = r.pass ? 'pass' : 'fail'; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  document.getElementById('out').hidden = false;
}

var running = false;
PlatformSDK.connect('rogue-sbx').then(function (api) {
  async function go() { if (running) return null; running = true; try { var rep = await attacks(api); show(rep); return rep; } finally { running = false; } }
  document.getElementById('run').onclick = go;
  api.onCommand('run-attacks', function () { go().then(function (rep) { if (rep) api.report(rep); }); }); // started by the Proof Panel
});
</script>
</body>
</html>
